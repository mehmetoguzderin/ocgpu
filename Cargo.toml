# SPDX-License-Identifier: CC0-1.0

[workspace]
resolver = "3"
members = [
    "crates/ocgpu-abi",
    "crates/ocgpu-loader",
    "crates/ocgpu-cuda",
    "crates/ocgpu-hip",
    "crates/ocgpu",
    "crates/ocgpu-capi",
    "crates/ocgpu-cli",
    "crates/ocgpu-codegen",
    "crates/ocgpu-oracle",
    "xtask",
]
default-members = [
    "crates/ocgpu",
    "crates/ocgpu-capi",
    "crates/ocgpu-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "CC0-1.0"
authors = ["mehmetoguzderin"]

[workspace.dependencies]
ocgpu-abi = { path = "crates/ocgpu-abi", version = "0.1.0" }
ocgpu-loader = { path = "crates/ocgpu-loader", version = "0.1.0" }
ocgpu-cuda = { path = "crates/ocgpu-cuda", version = "0.1.0" }
ocgpu-hip = { path = "crates/ocgpu-hip", version = "0.1.0" }
ocgpu = { path = "crates/ocgpu", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
toml = "0.9.5"
thiserror = "2.0.16"
miniz_oxide = "0.8.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

# SPDX-License-Identifier: CC0-1.0

[package]
name = "ocgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "SDK-free runtime-loaded CUDA and HIP compute API"
documentation = "https://docs.rs/ocgpu"
readme = "../README.md"
keywords = ["gpu", "cuda", "hip", "ffi"]
categories = ["api-bindings", "hardware-support"]

[features]
default = ["cuda", "hip", "raw-cuda", "raw-hip"]
cuda = ["dep:ocgpu-cuda"]
hip = ["dep:ocgpu-hip"]
raw-cuda = ["cuda"]
raw-hip = ["hip"]
explicit-library-path = [
    "ocgpu-cuda?/explicit-library-path",
    "ocgpu-hip?/explicit-library-path",
]
global-default-backend = ["cuda", "hip"]

[dependencies]
ocgpu-abi = { path = "../ocgpu-abi", version = "0.1.0" }
ocgpu-cuda = { path = "../ocgpu-cuda", version = "0.1.0", optional = true }
ocgpu-hip = { path = "../ocgpu-hip", version = "0.1.0", optional = true }

[dev-dependencies]
sha2 = "0.10.9"

[lints]
workspace = true

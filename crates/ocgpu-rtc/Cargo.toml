# SPDX-License-Identifier: CC0-1.0

[package]
name = "ocgpu-rtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "SDK-free runtime loading and safe typed access for NVRTC and HIPRTC"
documentation = "https://docs.rs/ocgpu-rtc"
readme = "../README.md"
keywords = ["gpu", "cuda", "hip", "jit"]
categories = ["api-bindings", "hardware-support"]

[features]
default = []
explicit-library-path = ["ocgpu-loader/explicit-library-path"]

[dependencies]
ocgpu-abi = { path = "../ocgpu-abi", version = "0.1.0" }
ocgpu-loader = { path = "../ocgpu-loader", version = "0.1.0" }

[lints]
workspace = true

# SPDX-License-Identifier: CC0-1.0

name: Security review

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install locked audit client
        run: cargo +1.97.1 install cargo-audit --version 0.22.2 --locked
      - name: Audit the exact lockfile
        run: cargo +1.97.1 audit --deny warnings
      - name: Verify shipping dependencies remain SDK-free
        run: |
          cargo +1.97.1 tree -p ocgpu -p ocgpu-capi -p ocgpu-cli > shipping-dependencies.txt
          if grep -E '(^|[[:space:]])(cudarc|rocmrc|bindgen|clang-sys)([[:space:]]|$)' shipping-dependencies.txt; then
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          # Exact lock-graph identifiers. Compound expressions are accepted when at least
          # one listed branch applies; LLVM-exception is an SPDX exception, not a license ID.
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, CC0-1.0, ISC, MIT, MPL-2.0, Unicode-3.0, Unlicense, Zlib

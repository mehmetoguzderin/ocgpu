# SPDX-License-Identifier: CC0-1.0

name: Prepare oracle update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-official-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Extract pinned official sources without installing GPU SDKs
        shell: pwsh
        run: ./.github/scripts/extract-official-oracles.ps1
      - name: Preserve normalized official review candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-official-oracle-candidates
          path: target/oracle-candidates
          if-no-files-found: error
          retention-days: 14

  extract-rust-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Extract exact crate surfaces without installing GPU SDKs
        run: |
          mkdir -p target/oracle-candidates
          cargo +1.97.1 run -p ocgpu-oracle -- extract-rust cudarc --output target/oracle-candidates/cudarc-0.19.9.json
          cargo +1.97.1 run -p ocgpu-oracle -- extract-rust rocmrc --output target/oracle-candidates/rocmrc-0.5.0.json
      - name: Preserve review candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: normalized-rust-oracle-candidates
          path: target/oracle-candidates
          if-no-files-found: error
          retention-days: 14
